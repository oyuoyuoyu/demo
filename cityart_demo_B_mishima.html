<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Art demo B — 三島</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden}
  #map{position:absolute;inset:0}
  /* 紙・ビネット等のオーバーレイ（タッチ無効） */
  .ov{position:absolute;inset:0;pointer-events:none}
  #paper{background:
     radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.08), transparent 60%),
     repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 1px, transparent 1px 3px),
     repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0 1px, transparent 1px 4px);
     mix-blend-mode:multiply;opacity:0}
  #tint{mix-blend-mode:multiply;opacity:0}
  #vig{background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);opacity:.6}
  /* 都市名・現地時刻（仕様で決めた重ね情報） */
  #cap{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;pointer-events:none;
       text-shadow:0 1px 8px rgba(0,0,0,.6);letter-spacing:.08em}
  #cap .city{font-size:22px;font-weight:300}
  #cap .time{font-size:40px;font-weight:200;font-variant-numeric:tabular-nums;line-height:1.1}
  #cap .taste{font-size:12px;opacity:.75;margin-top:4px}
  /* 操作パネル */
  #ui{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:5}
  #ui button,#ui select{background:rgba(20,20,20,.72);color:#eee;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 12px;font-size:13px;backdrop-filter:blur(6px)}
  #ui button.on{background:#eee;color:#111}
  #row2{position:absolute;top:calc(100px + env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:center;z-index:5;font-size:12px}
  #row2 input[type=range]{flex:1}
  #hint{position:absolute;top:calc(130px + env(safe-area-inset-top));left:10px;right:10px;font-size:11px;opacity:.7;z-index:5}
  .maplibregl-ctrl-attrib{font-size:9px;opacity:.6}
</style>
</head>
<body>
<div id="stage">
  <div id="map"></div>
  <div id="paper" class="ov"></div>
  <div id="tint" class="ov"></div>
  <div id="vig" class="ov"></div>
  <div id="cap"><div class="city">三島</div><div class="time">--:--</div><div class="taste"></div></div>
  <div id="ui"></div>
  <div id="row2"><span>範囲</span><input id="rng" type="range" min="11" max="15.5" step="0.1" value="13.6"><span id="rngv">—</span></div>
  <div id="hint">方式B（地図スタイリング）の見た目サンプル。上のボタンでテイスト切替、スライダーで表示範囲。ドラッグで移動も可。ラベルの有無は「ラベル」ボタン。</div>
</div>
<script>
const OFM = s => `https://tiles.openfreemap.org/styles/${s}`;
// 都市プリセット（中心・初期ズーム）
const CITIES = {
  '三島':   {c:[138.9186,35.1185], z:13.6, tz:'Asia/Tokyo'},
  'NC 芦ノ湖':{c:[138.99,35.20],   z:12.8, tz:'Asia/Tokyo'},
  '横浜':   {c:[139.6380,35.4437], z:13.2, tz:'Asia/Tokyo'},
  'San Jose':{c:[-121.8863,37.3382], z:12.6, tz:'America/Los_Angeles'},
};
// テイストプリセット：ベーススタイル + CSSフィルタ + 紙/色オーバーレイ + ラベル
const TASTES = {
  '墨絵':      {base:'positron', filter:'grayscale(1) contrast(1.75) brightness(1.04)', paper:.9, tint:'#f3eadb', tintA:.9, labels:false},
  '青焼き':    {base:'positron', filter:'grayscale(1) invert(1) sepia(1) saturate(6) hue-rotate(175deg) contrast(1.3) brightness(.85)', paper:.5, tint:'', tintA:0, labels:false},
  '淡彩':      {base:'liberty',  filter:'saturate(1.35) contrast(.92) brightness(1.05) blur(.4px)', paper:.9, tint:'#fbf4e4', tintA:.8, labels:false},
  '古地図':    {base:'bright',   filter:'sepia(.85) contrast(1.08) saturate(.9) brightness(.96)', paper:1, tint:'#e9d9b5', tintA:.7, labels:true},
  'ネオン夜景':{base:'dark',     filter:'saturate(2.4) contrast(1.25) brightness(1.05)', paper:0, tint:'', tintA:0, labels:false},
  '素の地図':  {base:'liberty',  filter:'none', paper:0, tint:'', tintA:0, labels:true},
};
let cur = {city:'三島', taste:'墨絵'};
const map = new maplibregl.Map({container:'map', style:OFM('positron'), center:CITIES['三島'].c, zoom:13.6, attributionControl:{compact:true}, dragRotate:false, pitchWithRotate:false});
map.touchZoomRotate.disableRotation();

function applyLabels(show){
  const st = map.getStyle(); if(!st) return;
  for(const l of st.layers){ if(l.type==='symbol') map.setLayoutProperty(l.id,'visibility', show?'visible':'none'); }
}
function applyTaste(name){
  const t = TASTES[name]; cur.taste = name;
  document.getElementById('map').style.filter = t.filter;
  document.getElementById('paper').style.opacity = t.paper;
  const tint = document.getElementById('tint'); tint.style.background = t.tint||'transparent'; tint.style.opacity = t.tintA;
  document.querySelector('#cap .taste').textContent = name + '  /  OpenStreetMap';
  const next = OFM(t.base);
  if(map._curBase !== t.base){
    map._curBase = t.base;
    map.setStyle(next);
    map.once('styledata', ()=> setTimeout(()=>applyLabels(t.labels), 50));
  } else applyLabels(t.labels);
  renderUI();
}
function applyCity(name){
  cur.city = name; const c = CITIES[name];
  map.jumpTo({center:c.c, zoom:c.z});
  document.querySelector('#cap .city').textContent = name;
  document.getElementById('rng').value = c.z; renderUI(); tick();
}
function renderUI(){
  const ui = document.getElementById('ui'); ui.innerHTML='';
  const sel = document.createElement('select');
  for(const k in CITIES){ const o=document.createElement('option'); o.textContent=k; o.selected=(k===cur.city); sel.appendChild(o);}
  sel.onchange = ()=>applyCity(sel.value); ui.appendChild(sel);
  for(const k in TASTES){ const b=document.createElement('button'); b.textContent=k; if(k===cur.taste) b.className='on'; b.onclick=()=>applyTaste(k); ui.appendChild(b);}
  const lb=document.createElement('button'); lb.textContent='ラベル'; lb.onclick=()=>{ TASTES[cur.taste].labels=!TASTES[cur.taste].labels; applyLabels(TASTES[cur.taste].labels); }; ui.appendChild(lb);
  document.getElementById('rngv').textContent = kmLabel(+document.getElementById('rng').value);
}
// ズーム→おおよその表示幅(km)（緯度35°・画面幅基準）
function kmLabel(z){ const mPerPx = 156543.03*Math.cos(35*Math.PI/180)/Math.pow(2,z); return (mPerPx*innerWidth/1000).toFixed(1)+' km幅'; }
document.getElementById('rng').oninput = e=>{ map.setZoom(+e.target.value); document.getElementById('rngv').textContent = kmLabel(+e.target.value); };
map.on('zoomend', ()=>{ document.getElementById('rng').value = map.getZoom(); document.getElementById('rngv').textContent = kmLabel(map.getZoom()); });
function tick(){ const tz = CITIES[cur.city].tz; document.querySelector('#cap .time').textContent = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',timeZone:tz}); }
setInterval(tick,1000);
map.on('load', ()=>{ map._curBase='positron'; applyTaste('墨絵'); tick(); });
map.on('error', e=>{ console.warn(e); if(String(e.error&&e.error.message).includes('404')||String(e.error&&e.error.status)==='404'){ /* ベーススタイルが無い場合はpositronへ */ map._curBase='positron'; map.setStyle(OFM('positron')); } });
</script>
</body>
</html>
